servers:
  - name: Atlas MCP Server
    description: Task management and organization server for LLMs
    repository: https://github.com/cyanheads/atlas-mcp-server
    version: 1.0.0
    tags: [task-management, organization]
    runtime: python
    install_command: python3
    command_args:
      - -m
      - atlas_mcp_server
    default_config:
      port: 8000
      auth_token: ""

  - name: Git MCP Server
    description: Git operations server for LLMs
    repository: https://github.com/cyanheads/git-mcp-server
    version: 0.9.0
    tags: [git, version-control]
    runtime: node
    install_command: npm
    install_args:
      - install
      - -g
      - "@modelcontextprotocol/server-git"
    command_args:
      - "@modelcontextprotocol/server-git"
    default_config:
      port: 8001
      auth_token: ""
      repository_path: ""

  - name: GitHub MCP Server
    description: GitHub operations server for LLMs
    repository: https://github.com/modelcontextprotocol/server-github
    version: 1.0.0
    tags: [github, version-control]
    runtime: node
    install_command: npm
    install_args:
      - install
      - -g
      - "@modelcontextprotocol/server-github"
    command_args:
      - "@modelcontextprotocol/server-github"
    default_config:
      port: 8002
      auth_token: ""
      env:
        GITHUB_PERSONAL_ACCESS_TOKEN: ""
  - name: CPFHub MCP Server
    description: Official MCP server for CPFHub.io — enables AI agents to query Brazilian CPF data (full name, birth date, gender). LGPD compliant, ~300ms response time.
    repository: https://github.com/cpfhub/cpfhub-mcp
    version: 1.0.1
    tags: [brazil, cpf, data-validation, api, lgpd]
    runtime: node
    install_command: npx
    command_args:
      - -y
      - "@cpfhub/mcp"
    default_config:
      port: 8003
      auth_token: ""
      env:
        CPFHUB_API_KEY: ""
